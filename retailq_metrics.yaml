version: 1.1

source: retail_q.gold.fact_sales

joins:
  - name: product
    source: retail_q.gold.dim_product
    "on": source.product_id = product.product_id
  - name: customer
    source: retail_q.gold.dim_customer
    "on": source.customer_id = customer.customer_id
  - name: calendar
    source: retail_q.gold.dim_calendar
    "on": source.transaction_date = calendar.date

comment: Retail sales metrics with product and customer dimensions

dimensions:
  - name: Transaction Month
    expr: "DATE_TRUNC('MONTH', transaction_date)"
    comment: Month when the transaction occurred
    display_name: Transaction Month
    format:
      type: date
      date_format: year_month_day
    synonyms:
      - month
      - sales month

  - name: Year
    expr: calendar.year
    comment: Calendar year from date dimension
    display_name: Year
    format:
      type: number
      decimal_places:
        type: exact
        places: 0

  - name: Quarter
    expr: calendar.quarter
    comment: Calendar quarter (1-4)
    display_name: Quarter
    format:
      type: number
      decimal_places:
        type: exact
        places: 0

  - name: Month Name
    expr: calendar.month_name
    comment: "Full month name (January, February, etc.)"
    display_name: Month Name
    synonyms:
      - month

  - name: Week of Year
    expr: calendar.week_of_year
    comment: Week number within the year
    display_name: Week of Year
    format:
      type: number
      decimal_places:
        type: exact
        places: 0

  - name: Day of Week
    expr: calendar.day_of_week_name
    comment: "Full day name (Monday, Tuesday, etc.)"
    display_name: Day of Week
    synonyms:
      - weekday
      - day name

  - name: Year Quarter
    expr: calendar.year_quarter
    comment: "Year and quarter combined (e.g., 2024-Q1)"
    display_name: Year Quarter

  - name: Year Month
    expr: calendar.year_month
    comment: Year and month combined
    display_name: Year Month

  - name: Is Weekend
    expr: calendar.is_weekend
    comment: Flag indicating if the date is a weekend
    display_name: Is Weekend

  - name: Is Weekday
    expr: calendar.is_weekday
    comment: Flag indicating if the date is a weekday
    display_name: Is Weekday

  - name: Product Category
    expr: product.category
    comment: Product category from dimension table
    display_name: Product Category
    synonyms:
      - category

  - name: Product Subcategory
    expr: product.subcategory
    comment: Product subcategory from dimension table
    display_name: Product Subcategory
    synonyms:
      - subcategory

  - name: Product Brand
    expr: product.brand
    comment: Product brand from dimension table
    display_name: Product Brand
    synonyms:
      - brand

  - name: Product Segment
    expr: product.product_segment
    comment: Product segment classification
    display_name: Product Segment

  - name: Customer Type
    expr: customer.customer_type
    comment: Type of customer account
    display_name: Customer Type

  - name: Customer Industry
    expr: customer.industry
    comment: Customer industry classification
    display_name: Customer Industry
    synonyms:
      - industry

  - name: Billing Country
    expr: customer.billing_country
    comment: Customer billing country
    display_name: Billing Country
    synonyms:
      - country

  - name: Billing State
    expr: customer.billing_state
    comment: Customer billing state
    display_name: Billing State
    synonyms:
      - state

  - name: Billing City
    expr: customer.billing_city
    comment: Customer billing city
    display_name: Billing City
    synonyms:
      - city

  - name: Sales Channel
    expr: sales_channel
    comment: Channel through which the sale was made
    display_name: Sales Channel

  - name: Payment Mode
    expr: payment_mode
    comment: Method of payment used for the transaction
    display_name: Payment Mode

measures:
  - name: Total Revenue
    expr: SUM(amount)
    comment: Sum of all transaction amounts
    display_name: Total Revenue
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - revenue
      - sales

  - name: Total Quantity
    expr: SUM(quantity)
    comment: Total number of units sold
    display_name: Total Quantity
    format:
      type: number
      decimal_places:
        type: exact
        places: 0

  - name: Total Discount
    expr: SUM(discount_amount)
    comment: Sum of all discount amounts applied
    display_name: Total Discount
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2

  - name: Net Revenue
    expr: SUM(amount - discount_amount)
    comment: Revenue after discounts
    display_name: Net Revenue
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2

  - name: Transaction Count
    expr: COUNT(transaction_id)
    comment: Total number of transactions
    display_name: Transaction Count
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - transactions
      - order count

  - name: Number of Customers
    expr: COUNT(DISTINCT customer_id)
    comment: Distinct count of unique customers
    display_name: Number of Customers
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
    synonyms:
      - customer count
      - unique customers

  - name: Average Transaction Value
    expr: MEASURE(`Total Revenue`) / MEASURE(`Transaction Count`)
    comment: Average revenue per transaction
    display_name: Average Transaction Value
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
    synonyms:
      - avg order value
      - AOV

  - name: Average Discount per Transaction
    expr: MEASURE(`Total Discount`) / MEASURE(`Transaction Count`)
    comment: Average discount amount per transaction
    display_name: Average Discount per Transaction
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2

  - name: Revenue per Customer
    expr: MEASURE(`Total Revenue`) / MEASURE(`Number of Customers`)
    comment: Average revenue per unique customer
    display_name: Revenue per Customer
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2